# The type-safe ID hierarchy. 1.21 made ResourceLocation a final class with a private constructor;
# 1.20's was neither. slimeknights.tconstruct.library.utils.ResourceId extends it, and MaterialId,
# MaterialStatsId, ModifierId, ToolStatId and Pattern extend that -- around 2000 references across
# 300 files, every one of which passes the ID somewhere a plain ResourceLocation is wanted (map
# keys, TagKey.create, buffer writes, Loadables). Reopening the class is two lines; the alternative
# is a wrapper type and a mod-wide rewrite that also breaks every addon. ResourceLocation#equals is
# an instanceof-plus-fields comparison, so a subclass still equals the plain location it names,
# which is what the whole scheme has always relied on.
public-f net.minecraft.resources.ResourceLocation # used by slimeknights.tconstruct.library.utils.ResourceId (and its five subclasses) -- final in 1.21.1
public net.minecraft.resources.ResourceLocation <init>(Ljava/lang/String;Ljava/lang/String;)V # used by slimeknights.tconstruct.library.utils.ResourceId -- the only constructor left, and it is private; it is the trusted one (1.20's third `Dummy` parameter is gone), so ResourceId validates before calling it

