# Prevent recursion when setting tool stack tag: ItemStack#setTag round trips the damage value through
# Item#getDamage/#setDamage, which our tools implement in terms of ToolStack. See ToolStack#writeTag for the details.
#! REWORK(slimeknights.tconstruct.library.tools.nbt.ToolStack, the ToolStackTest pin): ItemStack#tag is gone entirely -- ItemStack stores no raw CompoundTag field anymore, only a DataComponentMap (ItemStack implements DataComponentHolder/MutableDataComponentHolder). ToolStack.writeTag() does `stack.tag = tag` directly, and two more sites read `stack.tag.contains(...)`/`stack.tag.putInt(...)` -- this is the full component-based storage migration notes/T-A1-design.md flags as future ("T-A2") work, not a retarget.
#! public net.minecraft.world.item.ItemStack tag

