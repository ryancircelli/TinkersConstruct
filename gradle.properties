# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=3.11.2

# Minecraft Version Information
minecraft_base_version=1.21
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
neoforge_version=21.1.248
neoforge_range=[21.1.0,)
# javafml loader version, 4 across the 1.21 line
loader_range=[4,)

# Parchment mappings; ModDevGradle wants the Minecraft version and the mappings
# release separately, unlike Librarian which took a single combined string.
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# Build Dependencies
# Mantle is our own in-flight 1.21.1 port, consumed as a flat-dir artifact from
# ../libs holds frozen jars of ACCEPTED Mantle port tips (the sibling checkout build dir churns as agents work). One line to bump per accepted Mantle slice:
# it has to match the jar file name, Mantle-<mantle_version>.jar.
mantle_version=1.21.1-1.11.DEV.ad8242a6
mantle_range=[1.11,)

# Optional compat: JEI, Immersive Engineering, JSON Things and the CurseMaven mods
# are all pending T20. None of the source that touches them has been ported and
# none of them is published in a shape this build can consume, so both the
# dependencies and their version properties are gone until then.
