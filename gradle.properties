# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=3.11.2

# Minecraft Version Information
minecraft_base_version=1.21
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
neoforge_version=21.1.248
neoforge_range=[21.1.0,)
# javafml loader version, 4 across the 1.21 line
loader_range=[4,)

# Parchment mappings; ModDevGradle wants the Minecraft version and the mappings
# release separately, unlike Librarian which took a single combined string.
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# Build Dependencies
# Mantle is our own in-flight 1.21.1 port, consumed as a flat-dir artifact from
# ../libs holds frozen jars of ACCEPTED Mantle port tips (the sibling checkout build dir churns as agents work). One line to bump per accepted Mantle slice:
# it has to match the jar file name, Mantle-<mantle_version>.jar.
mantle_version=1.21.1-1.11.DEV.2100ca29
mantle_range=[1.11,)

# Optional compat. Every version here is the newest 1.21.1 build published on the
# mod's own maven at the time the compat source crossed over; see build.gradle for
# the two compat targets that have no 1.21.1 build at all and were dropped.
# JEI is pinned rather than using 1.20's `15.20.+` range: the plugin implements
# ICraftingCategoryExtension, whose shape changed inside the 19.x line, so a
# floating version would silently decide whether the mod compiles.
jei_version=19.44.0.401
ie_version=1.21.1-12.4.2-194
json_things_version=0.13.7
json_things_range=[0.13,)
# CurseMaven coordinates are project-id:file-id, so the "version" is a file id:
# craftingtweaks-neoforge-1.21.1-21.1.3.jar and dummmmmmy-1.20-2.0.2-neoforge.jar
crafting_tweaks_file=5856228
dummy_file=5709969
