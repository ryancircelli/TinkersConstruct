/*
 * Tinkers Construct
 * Master build file
 *
 * Authors: boni, Sunstrike, ProgWML6
 * Help from AbrarSyed
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // ModDevGradle replaces ForgeGradle 6 + Librarian for the 1.21.1 / NeoForge port.
    id 'net.neoforged.moddev' version '2.0.143'
    id 'io.freefair.lombok' version '8.14.4'
}

repositories {
    mavenCentral()
    maven { // our maven
        name = 'DVS1 Maven FS'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        // Parchment; also mirrored on the NeoForged maven that ModDevGradle adds itself,
        // declared here so the mappings source is obvious from the build script.
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    // Mantle for 1.21.1 is our own in-flight port and is not on any maven yet, so it is
    // consumed as a flat-dir artifact out of the sibling port checkout. See the dependencies
    // block below; `mantle_version` in gradle.properties is the only line that moves when
    // Mantle rebuilds, and this repository entry is the only line that moves when Mantle
    // starts publishing for real.
    flatDir {
        dir "${rootDir}/../libs"
    }
    // Gone with their dependencies, all pending T20 (compat/integration):
    //   maven.blamejared.com   - CraftTweaker, Immersive Engineering, JEI
    //   maven.tterrag.com      - The One Probe
    //   dogforce-games.com     - JSON Things
    //   cursemaven.com         - Diet, Balm, Crafting Tweaks, Moonlight, Mmm Mmm Mmm Mmm
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${system.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

/*
 * ---------------------------------------------------------------------------
 * Porting frontier
 * ---------------------------------------------------------------------------
 * porting/unported.txt and porting/unported-test.txt are the ledger of source
 * files that have not been ported to 1.21.1 yet. Everything listed is kept out
 * of its source set, so the build compiles only what has actually crossed over.
 *
 * The ledger is self-liquidating: a port PR deletes lines from it, never adds
 * them, and the last PR of the port deletes the files outright. checkPortingFrontier
 * below is what makes that a rule rather than an intention.
 */
ext.frontiers = [
        [name: 'main', ledger: file('porting/unported.txt'), roots: ['src/main/java'],
         island: file('porting/island.txt')],
        [name: 'test', ledger: file('porting/unported-test.txt'), roots: ['src/test/java', 'src/gametest/java'],
         island: file('porting/island-test.txt')],
]

// Reads a ledger into repo-relative paths, dropping blank lines and # comments.
ext.readFrontier = { File ledger ->
    if (!ledger.exists()) {
        return [] as List<String>
    }
    return ledger.readLines('UTF-8')
            *.trim()
            .findAll { !it.isEmpty() && !it.startsWith('#') }
}

// The entries of a ledger that live under one source root, relative to that root:
// Ant-style excludes are relative to the source directory, so the prefix comes off.
ext.frontierExcludes = { File ledger, String root ->
    return readFrontier(ledger)
            .findAll { it.startsWith("${root}/") }
            .collect { it.substring(root.length() + 1) }
}

sourceSets {
    main {
        java {
            frontierExcludes(frontiers[0].ledger, 'src/main/java').each { exclude it }
        }
        resources {
            srcDirs "src/generated/resources"
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
            // exclude debug resources, they are for helping us make the mod, not for the actual mod
            exclude 'assets/tconstruct/debug'
        }
    }
    // in-game behavior tests, run via the gameTestServer run config; not packaged into the mod jar
    // resources/java dirs use the sourceSet's default convention (src/gametest/resources, src/gametest/java)
    gametest {
        java {
            frontierExcludes(frontiers[1].ledger, 'src/gametest/java').each { exclude it }
        }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    test {
        java {
            frontierExcludes(frontiers[1].ledger, 'src/test/java').each { exclude it }
        }
    }
}

/*
 * Guards the frontier on every `check`:
 *
 *  (a) every path in a ledger must exist, so a file cannot be renamed or deleted
 *      out from under the ledger and leave a stale line behind;
 *  (b) every path must live under one of that ledger's source roots, since a path
 *      outside them would excite no exclude and silently hide nothing; and
 *  (c) a ledger may only shrink. The baseline is the committed copy at HEAD~,
 *      read with `git show HEAD~:<path>` - so on a branch each commit is checked
 *      against its parent, and CI checking out a PR head sees the same thing.
 *      Any entry present now but absent from the baseline fails the build: that
 *      is a file being pushed back behind the frontier instead of ported.
 *
 * If HEAD~ has no copy of the ledger (the commit that introduces it, or a shallow
 * clone with no parent) there is no baseline and the shrink check is skipped; the
 * other checks still run.
 *
 * The one exception to (c) is a file that did not exist at HEAD~ and is listed on
 * that ledger's island. Rule (c) exists to stop a file that compiles today from being
 * hidden tomorrow; a file created by the commit that lists it has no such yesterday
 * to be pushed back from. It also cannot be avoided: an island is compiled only for
 * measurement, so a new class written against island classes cannot join
 * sourceSets.main until the island does, and an island ledger is required to be a
 * subset of its frontier ledger (see errorBudget). Without the exception a slice
 * porting a package into the component era could not add a single class to it, which
 * would decide code shape by ledger mechanics.
 *
 * The exception is deliberately narrow. It permits exactly "born on the island,
 * leaves with it at T13" and nothing else: an existing file cannot use it (git says
 * so), and a new file that is not on an island cannot either, so a new class that
 * really does compile still has to prove it by joining the source set.
 *
 * T5 wrote that exception for src/main/java and porting/island.txt, and T7 found the
 * asymmetry it left behind: porting/island.txt is required to name only src/main/java
 * paths, so `island.contains(it)` could never hold for a test path and a slice could
 * not add a new test file at all - not listing it puts it in sourceSets.test, where it
 * cannot compile against island classes, and listing it in porting/unported-test.txt
 * tripped the no-growth rule. Each frontier therefore names its own island ledger:
 * porting/island.txt for main, porting/island-test.txt for tests. The mechanism is
 * T5's verbatim - listed on the island, and `git cat-file -e HEAD~:<path>` fails - and
 * so are the invariants below, which are what errorBudget already enforces on the main
 * island and what makes a listing mean "compiled for measurement" rather than "hidden".
 * The test island is measured by `errorBudgetTest`; see the error budget section.
 */
tasks.register('checkPortingFrontier') {
    group = 'verification'
    description = 'Verifies the porting frontier is intact and has not grown since HEAD~.'

    def projectDirectory = projectDir
    def ledgers = frontiers.collect { [name: it.name, roots: it.roots, path: rootDir.toPath().relativize(it.ledger.toPath()).toString(), file: it.ledger,
                                       islandPath: rootDir.toPath().relativize(it.island.toPath()).toString(), islandFile: it.island] }
    def read = readFrontier
    inputs.files(frontiers*.ledger).withPropertyName('ledgers')
    inputs.files(frontiers*.island).withPropertyName('islands')

    doLast {
        // Reads the committed copy of a ledger at HEAD~; null when there is no baseline.
        def baselineOf = { String path ->
            def out = new ByteArrayOutputStream()
            def proc = new ProcessBuilder('git', 'show', "HEAD~:${path}".toString())
                    .directory(projectDirectory)
                    .redirectErrorStream(false)
                    .start()
            proc.inputStream.transferTo(out)
            proc.errorStream.transferTo(OutputStream.nullOutputStream())
            return proc.waitFor() == 0 ? out.toString('UTF-8') : null
        }

        // True when HEAD~ has no copy of the file at all, meaning this commit created it.
        def isNewSinceBaseline = { String path ->
            def proc = new ProcessBuilder('git', 'cat-file', '-e', "HEAD~:${path}".toString())
                    .directory(projectDirectory)
                    .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                    .redirectError(ProcessBuilder.Redirect.DISCARD)
                    .start()
            return proc.waitFor() != 0
        }

        def failures = []
        ledgers.each { ledger ->
            def entries = read(ledger.file)

            def duplicates = entries.countBy { it }.findAll { it.value > 1 }.keySet()
            if (!duplicates.isEmpty()) {
                failures << "${ledger.path} lists ${duplicates.size()} path(s) more than once:\n  ${duplicates.join('\n  ')}"
            }

            def stray = entries.findAll { entry -> ledger.roots.every { !entry.startsWith("${it}/") } }
            if (!stray.isEmpty()) {
                failures << "${ledger.path} lists ${stray.size()} path(s) outside its source root(s) ${ledger.roots}, which would exclude nothing:\n  ${stray.join('\n  ')}"
            }

            def missing = entries.findAll { !new File(projectDirectory, it).exists() }
            if (!missing.isEmpty()) {
                failures << "${ledger.path} lists ${missing.size()} path(s) that do not exist. Delete the line if the file was ported or removed:\n  ${missing.join('\n  ')}"
            }

            // The island this ledger's born-file exception reads from has to hold up the same
            // invariants errorBudget puts on the main island, or the exception would let a file
            // through on a listing that means nothing.
            def islandEntries = read(ledger.islandFile)
            def island = islandEntries as Set
            def islandDuplicates = islandEntries.countBy { it }.findAll { it.value > 1 }.keySet()
            if (!islandDuplicates.isEmpty()) {
                failures << "${ledger.islandPath} lists ${islandDuplicates.size()} path(s) more than once:\n  ${islandDuplicates.join('\n  ')}"
            }
            def islandStray = islandEntries.findAll { entry -> ledger.roots.every { !entry.startsWith("${it}/") } }
            if (!islandStray.isEmpty()) {
                failures << "${ledger.islandPath} lists ${islandStray.size()} path(s) outside its frontier's source root(s) ${ledger.roots}:\n  ${islandStray.join('\n  ')}"
            }
            def islandMissing = islandEntries.findAll { !new File(projectDirectory, it).exists() }
            if (!islandMissing.isEmpty()) {
                failures << "${ledger.islandPath} lists ${islandMissing.size()} path(s) that do not exist:\n  ${islandMissing.join('\n  ')}"
            }
            def islandEscaped = islandEntries.findAll { !entries.contains(it) }
            if (!islandEscaped.isEmpty()) {
                failures << ("${ledger.islandPath} lists ${islandEscaped.size()} path(s) that ${ledger.path} does not. A file on an " +
                        "island is compiled for measurement only and must stay excluded from its source set:\n  ${islandEscaped.join('\n  ')}")
            }

            def baselineText = baselineOf(ledger.path)
            if (baselineText == null) {
                logger.lifecycle("porting frontier [${ledger.name}]: ${entries.size()} unported file(s); no copy at HEAD~, shrink check skipped")
                return
            }
            def baseline = baselineText.readLines()*.trim().findAll { !it.isEmpty() && !it.startsWith('#') } as Set
            def added = entries.findAll { !baseline.contains(it) }
            def born = added.findAll { island.contains(it) && isNewSinceBaseline(it) }
            added -= born
            if (!added.isEmpty()) {
                failures << ("${ledger.path} grew by ${added.size()} entr(y/ies) since HEAD~. The porting frontier only shrinks, " +
                        "except for a file created by this commit and listed on ${ledger.islandPath}:\n  ${added.join('\n  ')}")
            }
            if (!born.isEmpty()) {
                logger.lifecycle("porting frontier [${ledger.name}]: ${born.size()} new island file(s) added to ${ledger.path}:\n  ${born.join('\n  ')}")
            }
            def ported = baseline.size() - entries.size()
            logger.lifecycle("porting frontier [${ledger.name}]: ${entries.size()} unported file(s), ${ported >= 0 ? ported : 0} ported since HEAD~")
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Porting frontier check failed:\n\n${failures.join('\n\n')}\n")
        }
    }
}

tasks.named('check').configure {
    dependsOn 'checkPortingFrontier'
}

/*
 * ---------------------------------------------------------------------------
 * Error budget
 * ---------------------------------------------------------------------------
 * The frontier above works for anything that can be ported a file at a time. The
 * island - library/ + common/ + shared/ + fluids/ + the two root classes, ~1115
 * files - cannot: its classes reference one another densely enough that any cut
 * leaves both halves broken. It therefore ports through a RED stretch where the
 * set is known not to compile, and what has to be measured is not "does it
 * compile" but "is it getting better".
 *
 * porting/island.txt is a third ledger naming the files currently in that state.
 * They stay listed in porting/unported.txt as well, so they are still out of the
 * main source set and the real build stays green; the island is compiled
 * separately, for measurement only, into a scratch directory.
 *
 *   errorBudget        compiles the island with failOnError=false, parses javac's
 *                      diagnostics, and writes build/errorBudget/errors.json:
 *                      a total and a count per error category.
 *   checkErrorBudget   compares that measurement against the committed budget in
 *                      porting/errors.json. Fails if the total went up, or if a
 *                      category appeared that the budget does not name. Wired
 *                      into `check`.
 *   errorBudgetUpdate  promotes the measurement to porting/errors.json. Run by
 *                      hand; the resulting diff is the reviewable record of a PR
 *                      moving the budget, in either direction.
 *   errorBudgetTest    compiles porting/island-test.txt - the tests whose subjects
 *                      are on the island - alongside the island against the test
 *                      classpath, and counts the errors in the test files only.
 *                      Run by hand, not gated; see its own comment below.
 *
 * Why the measurement never writes porting/errors.json itself: `check` must not
 * mutate a committed file, or the gate would silently rubber-stamp whatever it
 * measured. The budget only moves when someone runs errorBudgetUpdate and commits
 * the diff.
 *
 * Why javac is forked rather than run through a JavaCompile task: Gradle's
 * JavaCompile gives no access to the compiler's DiagnosticListener, so the
 * diagnostics it prints cannot be collected. Forking the toolchain's own javac and
 * reading its output is the only way to count them.
 *
 * Categories are the shape of the breakage, not its location:
 *   package <name>          an import of a package that does not exist here
 *   symbol <kind> <name>    a reference to a type, method or field that does not
 *   other: <message>        everything else, message text as javac phrased it
 * A new category means a new *kind* of breakage, which is the interesting event -
 * it usually means a file arrived referencing something nobody has looked at yet.
 */
ext.islandLedger = file('porting/island.txt')
ext.errorBudgetLedger = file('porting/errors.json')

// Reads an errors.json into [total: int, islandFiles: int, categories: Map<String, int>].
ext.readErrorBudget = { File f ->
    def parsed = new groovy.json.JsonSlurper().parse(f, 'UTF-8')
    return [total: parsed.total as int, islandFiles: (parsed.islandFiles ?: 0) as int,
            categories: (parsed.categories ?: [:]).collectEntries { k, v -> [(k as String): v as int] }]
}

/*
 * Forks the toolchain's javac over `sourcePaths` with failOnError=false and returns the
 * diagnostics it printed as [file: absolute path, message: String, symbol: String or null].
 * The raw output is left in `log` and the source list in `argFile`, both for reading by hand.
 * Shared by errorBudget (the island) and errorBudgetTest (the test island).
 */
ext.forkJavacDiagnostics = { String javacExe, File workingDir, File classesDir, File argFile, File log,
                             List<String> sourcePaths, FileCollection classpath, FileCollection processorPath ->
    classesDir.deleteDir()
    classesDir.mkdirs()
    if (sourcePaths.isEmpty()) {
        log.text = ''
        return []
    }
    argFile.text = sourcePaths.join('\n')

    def command = [javacExe, '-d', classesDir.absolutePath, '-encoding', 'UTF-8', '-nowarn',
                   '-implicit:none', '-Xmaxerrs', '100000', '-classpath', classpath.asPath]
    if (!processorPath.isEmpty()) {
        // Lombok. Without it every generated accessor reads as a missing symbol and the
        // measurement is dominated by errors that do not exist.
        command += ['-processorpath', processorPath.asPath]
        command += ['-J--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                    '-J--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    } else {
        command += ['-proc:none']
    }
    command << "@${argFile.absolutePath}".toString()

    // failOnError=false, spelled out: javac's exit code is ignored, its diagnostics are the product.
    def output = new ByteArrayOutputStream()
    def proc = new ProcessBuilder(command).directory(workingDir).redirectErrorStream(true).start()
    proc.outputStream.close()
    proc.inputStream.transferTo(output)
    proc.waitFor()
    log.bytes = output.toByteArray()

    // javac writes an error as a `path:line: error: message` line, sometimes followed by
    // the offending source line, a caret, and `  symbol:`/`  location:` detail lines.
    def diagnostics = []
    def current = null
    log.readLines('UTF-8').each { line ->
        def head = line =~ /^(.*\.java):(\d+): (error|warning): (.*)$/
        if (head.find()) {
            current = head.group(3) == 'error' ? [file: head.group(1), message: head.group(4).trim(), symbol: null] : null
            if (current != null) {
                diagnostics << current
            }
            return
        }
        def detail = line =~ /^\s+symbol:\s+(.*)$/
        if (detail.find() && current != null && current.symbol == null) {
            current.symbol = detail.group(1).trim()
        }
    }
    return diagnostics
}

// Categorises one diagnostic from forkJavacDiagnostics; see the header comment above.
ext.categoriseDiagnostic = { d, File projectDirectory ->
    def pkg = d.message =~ /^package (\S+) (?:does not exist|is not visible)/
    if (pkg.find()) {
        return "package ${pkg.group(1)}".toString()
    }
    if (d.symbol != null) {
        // "class ToolAction", "method getFoo(int,int)", "variable bar" -> drop the argument
        // list, which varies per call site and would shatter one missing method into many.
        def parts = d.symbol.replaceAll(/\s+/, ' ').split(' ', 2)
        def name = parts.length > 1 ? parts[1].replaceAll(/\(.*$/, '') : parts[0]
        return "symbol ${parts[0]} ${name}".toString()
    }
    // Strip absolute paths so the key does not depend on where the repo is checked out.
    def message = d.message.replace(projectDirectory.absolutePath, '').replaceAll(/\s+/, ' ')
    return "other: ${message.length() > 120 ? message.substring(0, 120) : message}".toString()
}

tasks.register('errorBudget') {
    group = 'verification'
    description = 'Compiles the island named by porting/island.txt and counts the errors.'
    // T13 flipped the island's self-contained subset into sourceSets.main, so the island is no
    // longer a closed compilation: what is left of it references classes that now compile for
    // real. sourceSets.main.output is therefore part of the island's classpath, and compileJava
    // has to have run before the measurement means anything.
    dependsOn 'classes'

    def islandEntries = readFrontier(islandLedger)
    def mainEntries = readFrontier(frontiers[0].ledger) as Set
    def ledgerPath = rootDir.toPath().relativize(islandLedger.toPath()).toString()
    def mainLedgerPath = rootDir.toPath().relativize(frontiers[0].ledger.toPath()).toString()
    def projectDirectory = projectDir
    def islandSources = files(islandEntries.collect { file(it) })
    def compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
    def processorPath = sourceSets.main.annotationProcessorPath
    def javac = javaToolchains.compilerFor(java.toolchain).map { it.executablePath.asFile.absolutePath }
    def outputDir = layout.buildDirectory.dir('errorBudget')
    def fork = forkJavacDiagnostics
    def categorise = categoriseDiagnostic

    inputs.file(islandLedger).withPropertyName('island')
    inputs.files(islandSources).withPropertyName('islandSources')
    // Resolving these is deliberate even when the island is empty: it is what proves, on
    // every build, that the Minecraft, NeoForge and Mantle artifacts are actually there.
    inputs.files(compileClasspath).withPropertyName('compileClasspath')
    inputs.files(processorPath).withPropertyName('processorPath')
    outputs.dir(outputDir)

    doLast {
        // The island has to be internally consistent or the measurement means nothing.
        def problems = []
        def duplicates = islandEntries.countBy { it }.findAll { it.value > 1 }.keySet()
        if (!duplicates.isEmpty()) {
            problems << "${ledgerPath} lists ${duplicates.size()} path(s) more than once:\n  ${duplicates.join('\n  ')}"
        }
        def stray = islandEntries.findAll { !it.startsWith('src/main/java/') }
        if (!stray.isEmpty()) {
            problems << "${ledgerPath} lists ${stray.size()} path(s) outside src/main/java:\n  ${stray.join('\n  ')}"
        }
        def missing = islandEntries.findAll { !new File(projectDirectory, it).exists() }
        if (!missing.isEmpty()) {
            problems << "${ledgerPath} lists ${missing.size()} path(s) that do not exist:\n  ${missing.join('\n  ')}"
        }
        def escaped = islandEntries.findAll { !mainEntries.contains(it) }
        if (!escaped.isEmpty()) {
            problems << ("${ledgerPath} lists ${escaped.size()} path(s) that ${mainLedgerPath} does not. A file on the island " +
                    "is compiled for measurement only and must stay excluded from the main source set:\n  ${escaped.join('\n  ')}")
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Island ledger is inconsistent:\n\n${problems.join('\n\n')}\n")
        }

        def dir = outputDir.get().asFile
        def diagnostics = fork(javac.get(), projectDirectory, new File(dir, 'classes'), new File(dir, 'sources.txt'),
                new File(dir, 'javac.log'),
                islandEntries.collect { new File(projectDirectory, it).absolutePath.replace('\\', '/') },
                compileClasspath, processorPath)

        def categories = new TreeMap<String, Integer>()
        diagnostics.each { categories.merge(categorise(it, projectDirectory), 1, Integer.&sum) }
        def measurement = [total: diagnostics.size(), islandFiles: islandEntries.size(), categories: categories]

        new File(dir, 'errors.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(measurement)) + '\n'
        logger.lifecycle("error budget: ${measurement.total} error(s) across ${categories.size()} categor(y/ies) " +
                "in ${measurement.islandFiles} island file(s)")
        categories.each { name, count -> logger.lifecycle("  ${count.toString().padLeft(6)}  ${name}") }
    }
}

tasks.register('checkErrorBudget') {
    group = 'verification'
    description = 'Fails if the island got worse than porting/errors.json allows.'
    dependsOn 'errorBudget'

    def budgetFile = errorBudgetLedger
    def budgetPath = rootDir.toPath().relativize(errorBudgetLedger.toPath()).toString()
    def measuredFile = layout.buildDirectory.file('errorBudget/errors.json')
    def readBudget = readErrorBudget

    inputs.file(budgetFile).withPropertyName('budget')
    inputs.file(measuredFile).withPropertyName('measurement')

    doLast {
        def budget = readBudget(budgetFile)
        def measured = readBudget(measuredFile.get().asFile)

        def failures = []
        if (measured.total > budget.total) {
            failures << ("The island produces ${measured.total} error(s); ${budgetPath} allows ${budget.total}. " +
                    "The error budget only goes up on purpose: fix the regression, or run `gradlew errorBudgetUpdate` " +
                    "and commit the new budget so the increase is on the record.")
        }
        def novel = measured.categories.keySet().findAll { !budget.categories.containsKey(it) }
        if (!novel.isEmpty()) {
            failures << ("${novel.size()} error categor(y/ies) appeared that ${budgetPath} does not name. A new category is a " +
                    "new kind of breakage, not more of a known one:\n" +
                    novel.collect { "  ${measured.categories[it]}  ${it}" }.join('\n'))
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Error budget check failed:\n\n${failures.join('\n\n')}\n")
        }

        if (measured.total < budget.total) {
            logger.lifecycle("error budget: ${measured.total} of ${budget.total} used. " +
                    "Run `gradlew errorBudgetUpdate` to ratchet ${budgetPath} down to what the island actually costs.")
        } else {
            logger.lifecycle("error budget: ${measured.total} of ${budget.total} used, exactly on budget")
        }
    }
}

tasks.register('errorBudgetUpdate', Copy) {
    group = 'verification'
    description = 'Writes the measured island errors to porting/errors.json, to be reviewed and committed.'
    dependsOn 'errorBudget'
    from layout.buildDirectory.file('errorBudget/errors.json')
    into errorBudgetLedger.parentFile
}

/*
 * The test island. A test whose subject is on the island cannot compile in sourceSets.test
 * either, so it sits on the test frontier the same way its subject sits on the main one, and
 * porting/island-test.txt names the ones a slice has brought up to 1.21 - "island standard",
 * which every slice since T5 has claimed in its notes by compiling the test sources alongside
 * the island by hand. This task is that procedure, so the claim is reproducible and so a
 * listing on porting/island-test.txt means "compiled for measurement" rather than "hidden".
 *
 * The test island is compiled in the same javac invocation as the island (it needs the island's
 * sources, which have no jar) but against the test compile classpath, which is why it cannot
 * simply be listed on porting/island.txt: that ledger's files are compiled with the main
 * classpath, where JUnit and Mockito do not exist.
 *
 * Deliberately NOT wired into `check` and deliberately without a committed ledger of its own.
 * The island's own diagnostics dominate the compilation and are already gated by
 * checkErrorBudget; a second ratchet over the same javac run would gate the same breakage
 * twice, and T13 rehomes these files anyway. What a slice owes is the number and the reading
 * of it in the PR, exactly as T5-T7 did.
 */
tasks.register('errorBudgetTest') {
    group = 'verification'
    description = 'Compiles porting/island-test.txt alongside the island and counts the errors in the test files.'
    dependsOn 'classes', 'testClasses'

    def islandEntries = readFrontier(islandLedger)
    def testIsland = frontiers.find { it.name == 'test' }
    def testIslandEntries = readFrontier(testIsland.island)
    def testIslandPath = rootDir.toPath().relativize(testIsland.island.toPath()).toString()
    def projectDirectory = projectDir
    def sources = files((islandEntries + testIslandEntries).collect { file(it) })
    // Both, and the union is the point: the test classpath carries JUnit, Mockito and AssertJ,
    // the island's own carries Minecraft, NeoForge and Mantle. Both source sets' *output* joins
    // them since T13, for the reason errorBudget states - neither island is closed any more.
    // The test output matters as much as the main one: BaseMcTest, RoundTripAssertions and
    // FixtureFiles left the test island in T13 and are what the 39 files still on it extend.
    def compileClasspath = sourceSets.main.output + sourceSets.test.output +
            sourceSets.main.compileClasspath + sourceSets.test.compileClasspath
    def processorPath = sourceSets.main.annotationProcessorPath + sourceSets.test.annotationProcessorPath
    def javac = javaToolchains.compilerFor(java.toolchain).map { it.executablePath.asFile.absolutePath }
    def outputDir = layout.buildDirectory.dir('errorBudgetTest')
    def fork = forkJavacDiagnostics
    def categorise = categoriseDiagnostic

    inputs.files(islandLedger, testIsland.island).withPropertyName('islands')
    inputs.files(sources).withPropertyName('sources')
    inputs.files(compileClasspath).withPropertyName('compileClasspath')
    inputs.files(processorPath).withPropertyName('processorPath')
    outputs.dir(outputDir)

    doLast {
        // checkPortingFrontier owns this ledger's invariants; this only needs the files to be there.
        def missing = testIslandEntries.findAll { !new File(projectDirectory, it).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException("${testIslandPath} lists ${missing.size()} path(s) that do not exist:\n  ${missing.join('\n  ')}\n")
        }

        def dir = outputDir.get().asFile
        def diagnostics = fork(javac.get(), projectDirectory, new File(dir, 'classes'), new File(dir, 'sources.txt'),
                new File(dir, 'javac.log'),
                (islandEntries + testIslandEntries).collect { new File(projectDirectory, it).absolutePath.replace('\\', '/') },
                compileClasspath, processorPath)

        // Only the test island's own diagnostics are this measurement; the island's are errorBudget's.
        def testPaths = testIslandEntries.collect { new File(projectDirectory, it).absolutePath.replace('\\', '/') } as Set
        def mine = diagnostics.findAll { testPaths.contains(it.file.replace('\\', '/')) }

        def categories = new TreeMap<String, Integer>()
        mine.each { categories.merge(categorise(it, projectDirectory), 1, Integer.&sum) }
        def measurement = [total: mine.size(), islandFiles: testIslandEntries.size(), categories: categories]

        new File(dir, 'errors-test.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(measurement)) + '\n'
        logger.lifecycle("test error budget: ${measurement.total} error(s) across ${categories.size()} categor(y/ies) " +
                "in ${measurement.islandFiles} test island file(s), out of ${diagnostics.size()} in the whole compilation")
        categories.each { name, count -> logger.lifecycle("  ${count.toString().padLeft(6)}  ${name}") }
    }
}

tasks.named('check').configure {
    dependsOn 'checkErrorBudget'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = project.parchment_version
    }

    // The shipped access transformer is now Mojang-named end to end (translated and triaged in
    // T2), so ModDevGradle's convention of picking up
    // src/main/resources/META-INF/accesstransformer.cfg automatically is left alone.
    // validateAccessTransformers fails the build if any active line stops resolving, which is
    // the safety net T2 wants and keeps the file honest for the rest of the port.
    validateAccessTransformers = true

    mods {
        tconstruct {
            sourceSet sourceSets.main
            // the gametests ride along with the mod classes so they can see production code,
            // while staying out of the shipped jar (the jar task only takes main)
            sourceSet sourceSets.gametest
        }
    }

    // T1 left this off on the grounds that every test was behind the frontier, so the test
    // classpath needed JUnit but not Minecraft. T13 flips the island's self-contained subset
    // into sourceSets.main and brings the first tests back with it, and every one of them
    // loads a Minecraft class. Enabling it puts Minecraft, NeoForge and this mod's own classes
    // on the test classpath and runs `test` through NeoForge's test launcher, which is what
    // bootstraps the registries the tests then read.
    unitTest {
        enable()
        testedMod = mods.tconstruct
    }

    runs {
        // applies to all the run configs below
        configureEach {
            gameDirectory = project.file('run')
            // Recommended logging level for the console.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            //The below if statements are to add args to your gradle.properties file in user home
            // (DO NOT add them directly to the gradle.properties file for this project)
            // Setting the below properties allows use of your normal Minecraft account in the
            // dev environment including having your skin load. Each property also has a comment
            // explaining what information to set the value to/format it expects
            if (project.hasProperty('mc_uuid')) {
                //Your uuid without any dashes in the middle
                programArguments.addAll('--uuid', project.getProperty('mc_uuid'))
            }
            if (project.hasProperty('mc_username')) {
                //Your username/display name, this is the name that shows up in chat
                // Note: This is not your email, even if you have a Mojang account
                programArguments.addAll('--username', project.getProperty('mc_username'))
            }
            if (project.hasProperty('mc_accessToken')) {
                //Your access token, you can find it in your '.minecraft/launcher_profiles.json' file
                programArguments.addAll('--accessToken', project.getProperty('mc_accessToken'))
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            // ModDevGradle does not synthesise the data generator arguments the way ForgeGradle
            // did, so they are carried over by hand, --existing-mod included.
            programArguments.addAll(
                    '--mod', 'tconstruct',
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'mantle')
        }

        gameTestServer {
            type = 'gameTestServer'
            // isolate the gametest world from the regular dev server's save data
            gameDirectory = project.file('run/gameTestServer')
            // run out of the gametest source set, which pulls main along with it
            sourceSet = sourceSets.gametest
            // scans mod classes for @GameTestHolder("tconstruct") methods; the NeoForge spelling
            // of what was forge.enabledGameTestNamespaces under ForgeGradle
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tconstruct'
        }
    }

    // neoForge.unitTest (which puts a loaded Minecraft on the test classpath and bootstraps FML
    // around JUnit) stays off while every test is behind the porting frontier. It gets enabled,
    // with testedMod = mods.tconstruct, by the PR that brings the first Minecraft-touching test
    // back across.
}

dependencies {
    // Minecraft and NeoForge come from the neoForge block above, not from a dependency line.

    // Mantle: our own 1.21.1 port, taken from the sibling checkout's build/libs via the flatDir
    // repository above. `implementation` puts it on the compile classpath and on the run
    // configs' runtime classpath, where NeoForge's classpath mod locator picks it up as a mod.
    implementation "slimeknights.mantle:Mantle:${mantle_version}"

    // pending, T20: JEI (compileOnly common+forge api, runtimeOnly full jar)
    // pending, T20: Immersive Engineering
    // pending, T20: JSON Things
    // pending, T20: the CurseMaven compat/runtime mods - Diet, Balm, Crafting Tweaks,
    //               Moonlight Lib, Mmm Mmm Mmm Mmm, The One Probe
    // None of the source that references them has been ported, so nothing on the compiled
    // source set needs them and none of them is published in a shape this build can consume.

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    // Mockito 4.2.0 was 'mockito-inline', whose bundled Byte Buddy 1.12.4 refuses any class file newer than Java
    // 18 ("Java 21 (65) is not supported by the current version of Byte Buddy"). 1.20 compiled and ran on Java 17
    // so it never hit the ceiling; 1.21.1 is Java 21, and every mock() in the suite failed with
    // "Could not modify all classes". Mockito 5 makes the inline mock maker the default, so mockito-core is the
    // whole of what mockito-inline used to add and the separate artifact is not republished past 5.2.0.
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version': artifact_version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neoforge_range': neoforge_range,
        'mantle_range': mantle_range
    ]
    inputs.properties replaceProperties

    // No `project` in the binding: neither template references it, and reaching for
    // Task.project at execution time is deprecated and configuration-cache hostile.
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Tinkers Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// no reobfJar: 1.21 userdev and production are both Mojang-named, so there is nothing to
// reobfuscate and ModDevGradle does not provide the task.

java {
    withSourcesJar()
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

